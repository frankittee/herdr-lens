id = "herdr-lens"
name = "Herdr Lens"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open the current agent conversation in a local web view"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[startup]]
command = ["target/release/herdr-lens", "startup"]

[[actions]]
id = "open"
title = "Open link"
contexts = ["pane"]
command = ["target/release/herdr-lens", "open"]

[[actions]]
id = "copy"
title = "Copy link"
contexts = ["pane"]
command = ["target/release/herdr-lens", "copy"]
