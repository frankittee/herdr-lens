[package]
name = "herdr-lens"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin backend for a local agent conversation viewer"

[dependencies]
anstyle-parse = "1.0.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12"
usage = { version = "6", package = "usage-rs", default-features = false, features = ["diagnostics", "help"] }
