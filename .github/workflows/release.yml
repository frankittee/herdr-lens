name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches manifest version
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' herdr-plugin.toml | head -n 1)
          test "v$version" = "$TAG" || { echo "tag $TAG != manifest v$version"; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run --cwd web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  binary:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: pkg/dist
      - name: Package
        run: |
          asset="herdr-lens-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/herdr-lens" pkg/
          tar -czf "$asset" -C pkg herdr-lens dist
          if command -v sha256sum >/dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            herdr-lens-${{ matrix.target }}.tar.gz
            herdr-lens-${{ matrix.target }}.tar.gz.sha256
